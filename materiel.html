<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matériel pour 2 jours en refuge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3ECDC;
    --card: #FBF7EC;
    --ink: #2B2118;
    --ink-soft: #6B5D4F;
    --line: #E3D6BA;
    --accent: #FDD835;
    --accent-soft: #FCF3C6;
    --accent-line: #F0DE8A;
    --stamp-a: #C2185B;
    --stamp-b: #8E24AA;
    --shadow: 0 2px 8px rgba(43,33,24,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(rgba(43,33,24,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    color:var(--ink);
    font-family:'Karla', sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 24px 90px;}

  .site-header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    padding:28px 0 8px;
  }
  .site-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:22px; color:var(--ink);
    letter-spacing:-0.01em;
  }
  .site-nav{display:flex; gap:24px;}
  .nav-link{
    font-family:'Space Mono', monospace; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); text-decoration:none;
    padding-bottom:3px; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .nav-link:hover{color:var(--ink);}
  .nav-link.active{color:var(--ink); font-weight:700; border-bottom-color:var(--accent);}

  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px,4.2vw,40px);
    line-height:1.08; margin:24px 0 10px; letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft); font-size:16px; max-width:640px; margin:0 0 8px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; margin-top:20px;}

  .cat{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  .cat-head{
    padding:14px 18px; border-bottom:1.5px dashed var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .cat-icon{font-size:18px;}
  .cat-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:16.5px; color:var(--ink);
  }
  .cat-list{list-style:none; margin:0; padding:10px 18px 16px;}
  .item{
    padding:7px 0; font-size:14px; color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-note{
    display:block; font-size:12px; color:var(--stamp-a); margin-top:2px; font-weight:600;
  }

  footer{
    margin-top:48px; padding-top:20px; border-top:2px dashed var(--line);
    font-family:'Space Mono', monospace; font-size:11.5px; color:var(--ink-soft);
  }

  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <div class="site-title">Rando piou piou</div>
    <nav class="site-nav">
      <a class="nav-link" href="index.html">Itinéraire</a>
      <a class="nav-link active" href="materiel.html">Valise</a>
    </nav>
  </header>
  <h1>Matériel pour un week-end de 2 jours en refuge</h1>

  <div class="grid" id="grid"></div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ============================================
// Connexion Supabase — mêmes identifiants que index.html
// ============================================
const SUPABASE_URL = 'https://xomfsciqbljjfzrzjilz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvbWZzY2lxYmxqamZ6cnpqaWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDE5NTcsImV4cCI6MjEwMDExNzk1N30.rNuei181sRq96a_nAtaK_UOHpmE1sHNSSCW_29KaPXE';

if(!window.supabase){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('grid').innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;color:#A5472A;padding:40px 0;">Le script Supabase (CDN) n\'a pas pu se charger.</p>';
  });
  throw new Error('window.supabase indisponible');
}
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadMateriel(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;color:var(--ink-soft);padding:40px 0;">Chargement…</p>';

  try {
    const [catsRes, itemsRes] = await Promise.all([
      supabaseClient.from('materiel_categories').select('*').order('ordre'),
      supabaseClient.from('materiel_items').select('*').order('ordre'),
    ]);

    if(catsRes.error) throw catsRes.error;
    if(itemsRes.error) throw itemsRes.error;

    const cats = catsRes.data || [];
    const items = itemsRes.data || [];

    grid.innerHTML = cats.map(cat => `
      <div class="cat">
        <div class="cat-head">
          <span class="cat-icon">${cat.icone}</span>
          <span class="cat-title">${cat.titre}</span>
        </div>
        <ul class="cat-list">
          ${items.filter(it => it.categorie_id === cat.id).map(it => `
            <li class="item">${it.label}${it.note ? `<span class="item-note">${it.note}</span>` : ''}</li>
          `).join('')}
        </ul>
      </div>
    `).join('');
  } catch(err){
    grid.innerHTML = `<p style="font-family:'IBM Plex Mono',monospace;color:#A5472A;padding:40px 0;">Erreur de chargement : ${err.message || err}<br>Vérifie que les tables materiel_categories et materiel_items existent.</p>`;
    console.error(err);
  }
}

loadMateriel();
</script>

</body>
</html>
