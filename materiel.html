<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matériel pour 2 jours en refuge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFEEE7;
    --card: #FFFFFF;
    --ink: #1C2420;
    --ink-soft: #5A645D;
    --line: #D8D6CB;
    --accent: #D9720B;
    --accent-soft: #FBE8D3;
    --accent-line: #F0C99A;
    --done: #3A7D44;
    --shadow: 0 1px 3px rgba(26,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Work Sans', sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 24px 90px;}

  header{padding:44px 0 8px;}
  .back-link{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;
  }
  .back-link:hover{color:var(--accent);}
  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:clamp(30px,4.5vw,44px);
    line-height:1.05; margin:0 0 12px; letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft); font-size:16px; max-width:640px; margin:0 0 8px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; margin-top:8px;}

  .cat{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  .cat-head{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .cat-icon{font-size:18px;}
  .cat-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:16.5px; color:var(--ink);
  }
  .cat-list{list-style:none; margin:0; padding:10px 18px 16px;}
  .item{
    padding:7px 0; font-size:14px; color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-note{
    display:block; font-size:12px; color:var(--accent); margin-top:2px; font-weight:500;
  }

  footer{
    margin-top:48px; padding-top:20px; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);
  }

  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back-link" href="index.html">← Retour aux itinéraires</a>
    <h1>Matériel pour un week-end de 2 jours en refuge</h1>
    <p class="subhead">Liste pensée pour une nuitée en refuge gardé, montagne d'été.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Liste indicative pour une rando estivale classique — à adapter selon la météo, l'altitude et la durée réelle de chaque itinéraire.
  </footer>
</div>

<script>
const CATEGORIES = [
  {
    title: 'Porté sur soi', icon: '🥾',
    items: [
      'Chaussures de randonnée à bonnes semelles (déjà rodées)',
      'Chaussettes techniques (pas de coton)',
      'Pantalon ou short de randonnée',
      'T-shirt technique respirant',
      'Casquette ou chapeau',
      'Lunettes de soleil (catégorie 3 minimum en altitude)',
    ]
  },
  {
    title: 'Dans le sac à dos', icon: '🎒',
    items: [
      'Polaire ou petite doudoune',
      'Veste imperméable et coupe-vent',
      'Pantalon de pluie ou poncho',
      { label: 'Vêtements de rechange pour la soirée au refuge', note: 'un t-shirt propre change la vie' },
      'Sous-vêtements et chaussettes de rechange',
      'Bonnet léger (les nuits sont fraîches en altitude)',
    ]
  },
  {
    title: 'Nuit au refuge', icon: '🏔',
    items: [
      { label: 'Drap de sac (sac à viande)', note: 'souvent obligatoire, se renseigner avant' },
      'Boules Quies (dortoirs partagés)',
      'Lampe frontale + piles de rechange',
      'Petite trousse de toilette',
      { label: 'Espèces', note: 'certains refuges sont cash only' },
    ]
  },
  {
    title: 'Eau & nourriture', icon: '💧',
    items: [
      { label: 'Gourde ou poche à eau (1,5 L minimum)', note: '' },
      'Pastilles ou filtre de purification d\'eau',
      'Barres énergétiques / fruits secs',
      'Pique-nique pour le trajet (J1 et/ou J2 selon horaires de repas)',
    ]
  },
  {
    title: 'Sécurité & navigation', icon: '🧭',
    items: [
      'Trousse de premiers secours (pansements, désinfectant, anti-ampoules)',
      'Carte IGN ou trace GPX téléchargée hors-ligne',
      'Téléphone chargé + batterie externe',
      'Sifflet',
      'Couverture de survie',
      'Crème solaire (indice élevé, l\'altitude renforce les UV)',
    ]
  },
  {
    title: 'Divers utiles', icon: '🧰',
    items: [
      'Bâtons de marche (recommandés pour les fortes descentes)',
      'Sacs plastique / poche à déchets (on ne laisse rien sur place)',
      'Carte d\'identité (certains refuges la demandent)',
      'Billet de bus/train imprimé ou sur le téléphone (zones sans réseau)',
    ]
  },
];

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = CATEGORIES.map(cat => `
    <div class="cat">
      <div class="cat-head">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
      </div>
      <ul class="cat-list">
        ${cat.items.map(it => {
          const label = typeof it === 'string' ? it : it.label;
          const note = typeof it === 'string' ? null : it.note;
          return `<li class="item">${label}${note ? `<span class="item-note">${note}</span>` : ''}</li>`;
        }).join('')}
      </ul>
    </div>
  `).join('');
}

render();
</script>

</body>
</html>
