<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matériel pour 2 jours en refuge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFEEE7;
    --card: #FFFFFF;
    --ink: #1C2420;
    --ink-soft: #5A645D;
    --line: #D8D6CB;
    --accent: #D9720B;
    --accent-soft: #FBE8D3;
    --accent-line: #F0C99A;
    --done: #3A7D44;
    --shadow: 0 1px 3px rgba(26,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Work Sans', sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:0 24px 90px;}

  header{padding:44px 0 8px;}
  .back-link{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;
  }
  .back-link:hover{color:var(--accent);}
  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:clamp(30px,4.5vw,44px);
    line-height:1.05; margin:0 0 12px; letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft); font-size:16px; max-width:640px; margin:0 0 8px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; margin-top:8px;}

  .cat{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  .cat-head{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .cat-icon{font-size:18px;}
  .cat-title{
    font-family:'Fraunces', serif; font-weight:700; font-size:16.5px; color:var(--ink);
  }
  .cat-list{list-style:none; margin:0; padding:10px 18px 16px;}
  .item{
    padding:7px 0; font-size:14px; color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-note{
    display:block; font-size:12px; color:var(--accent); margin-top:2px; font-weight:500;
  }

  footer{
    margin-top:48px; padding-top:20px; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);
  }

  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back-link" href="index.html">← Retour aux itinéraires</a>
    <h1>Matériel pour un week-end de 2 jours en refuge</h1>
    <p class="subhead">Liste pensée pour une nuitée en refuge gardé, montagne d'été.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Liste indicative pour une rando estivale classique — à adapter selon la météo, l'altitude et la durée réelle de chaque itinéraire.
  </footer>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ============================================
// Connexion Supabase — mêmes identifiants que index.html
// ============================================
const SUPABASE_URL = 'https://xomfsciqbljjfzrzjilz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvbWZzY2lxYmxqamZ6cnpqaWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDE5NTcsImV4cCI6MjEwMDExNzk1N30.rNuei181sRq96a_nAtaK_UOHpmE1sHNSSCW_29KaPXE';

if(!window.supabase){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('grid').innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;color:#A5472A;padding:40px 0;">Le script Supabase (CDN) n\'a pas pu se charger.</p>';
  });
  throw new Error('window.supabase indisponible');
}
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadMateriel(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<p style="font-family:\'IBM Plex Mono\',monospace;color:var(--ink-soft);padding:40px 0;">Chargement…</p>';

  try {
    const [catsRes, itemsRes] = await Promise.all([
      supabaseClient.from('materiel_categories').select('*').order('ordre'),
      supabaseClient.from('materiel_items').select('*').order('ordre'),
    ]);

    if(catsRes.error) throw catsRes.error;
    if(itemsRes.error) throw itemsRes.error;

    const cats = catsRes.data || [];
    const items = itemsRes.data || [];

    grid.innerHTML = cats.map(cat => `
      <div class="cat">
        <div class="cat-head">
          <span class="cat-icon">${cat.icone}</span>
          <span class="cat-title">${cat.titre}</span>
        </div>
        <ul class="cat-list">
          ${items.filter(it => it.categorie_id === cat.id).map(it => `
            <li class="item">${it.label}${it.note ? `<span class="item-note">${it.note}</span>` : ''}</li>
          `).join('')}
        </ul>
      </div>
    `).join('');
  } catch(err){
    grid.innerHTML = `<p style="font-family:'IBM Plex Mono',monospace;color:#A5472A;padding:40px 0;">Erreur de chargement : ${err.message || err}<br>Vérifie que les tables materiel_categories et materiel_items existent.</p>`;
    console.error(err);
  }
}

loadMateriel();
</script>

</body>
</html>
